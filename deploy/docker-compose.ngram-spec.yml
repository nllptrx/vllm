services:
  qwen:
    image: nllptrx/vllm-openai:0.25.1-apc-ngram-fix
    command:
      - Qwen/Qwen3.6-35B-A3B-FP8
      - --served-model-name
      - qwen3.6-35b-a3b
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "64"
      - --gpu-memory-utilization
      - "0.50"
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --enable-auto-tool-choice
      - --mm-processor-cache-gb
      - "4"
      - --limit-mm-per-prompt
      - '{"image":8}'
      - --mm-processor-kwargs
      - '{"max_pixels":12845056}'
      - --enable-prefix-caching
      - --speculative-config
      - '{"method":"ngram","num_speculative_tokens":3,"prompt_lookup_min":8,"prompt_lookup_max":16}'
      - --host
      - 0.0.0.0
      - --port
      - "8001"
